# Installation smoke test only. Labels are generated by MH-1, NOT by DFT.
# Run from the repository root after scripts/check_mace_environment.py.
name: mh1_installation_check
foundation_model: models/mace-mh-1.model
foundation_head: omat_pbe
multiheads_finetuning: false
train_file: tmp/environment-checks/mace/synthetic-train.extxyz
valid_file: tmp/environment-checks/mace/synthetic-valid.extxyz
energy_key: energy
forces_key: forces
stress_key: stress
E0s: estimated
loss: stress
compute_stress: true
energy_weight: 1.0
forces_weight: 1.0
stress_weight: 1.0
device: cuda
default_dtype: float32
batch_size: 1
valid_batch_size: 1
num_workers: 0
max_num_epochs: 2
eval_interval: 1
lr: 0.0001
weight_decay: 0.0
clip_grad: 1.0
seed: 17
plot: false
log_dir: tmp/environment-checks/mace/training/logs
results_dir: tmp/environment-checks/mace/training/results
checkpoints_dir: tmp/environment-checks/mace/training/checkpoints
model_dir: tmp/environment-checks/mace/training/models
